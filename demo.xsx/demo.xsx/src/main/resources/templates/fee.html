<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Danh sách khoản thu</title>
</head>
<body>
<h2>Danh sách khoản thu</h2>
<a href="/fees/add">Thêm khoản thu mới</a>
<table border="1">
  <tr>
    <th>ID</th>
    <th>Mô tả</th>
    <th>Số tiền</th>
    <th>Loại khoản thu</th>
    <th>Hành động</th>
  </tr>
  <tr th:each="fee : ${fees}">
    <td th:text="${fee.id}"></td>
    <td th:text="${fee.description}"></td>
    <td th:text="${fee.amount}"></td>
    <td th:text="${fee.category}"></td>
    <td>
      <a th:href="@{/fees/edit/{id}(id=${fee.id})}">Chỉnh sửa</a> |
      <a th:href="@{/fees/delete/{id}(id=${fee.id})}" onclick="return confirm('Xác nhận xóa?');">Xóa</a>
    </td>
  </tr>
</table>
</body>
</html>
