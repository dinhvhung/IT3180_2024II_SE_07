<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm cư dân</title>
</head>
<body>
<h2>Thêm cư dân mới</h2>
<form action="/residents/add" method="post">
    <label for="fullName">Họ và tên:</label>
    <input type="text" id="fullName" name="fullName" value="${resident.fullName}" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="${resident.email}" required><br>

    <label for="phone">Số điện thoại:</label>
    <input type="text" id="phone" name="phone" value="${resident.phone}" required><br>

    <label for="apartmentNumber">Số căn hộ:</label>
    <input type="text" id="apartmentNumber" name="apartmentNumber" value="${resident.apartmentNumber}" required><br>

    <button type="submit">Thêm cư dân</button>

</form>
</body>
</html>
